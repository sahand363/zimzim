name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build APK
        env:
          ZZ_KEYSTORE_B64: ${{ secrets.ZZ_KEYSTORE_B64 }}
          ZZ_KEYSTORE_PASS: ${{ secrets.ZZ_KEYSTORE_PASS }}
        run: |
          if [ -n "$ZZ_KEYSTORE_B64" ]; then
            echo "$ZZ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export ZZ_KEYSTORE="$RUNNER_TEMP/release.p12"
            echo "Signing with the private release key"
          else
            echo "::error::Missing ZZ_KEYSTORE_B64 secret"; exit 1
          fi
          gradle --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ZimZim-${{ steps.ver.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ZimZim-${{ steps.ver.outputs.name }}
          path: android/dist/*.apk
      # Tag android-v<versionName>; never marked "latest" so the server installer keeps using v* releases.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="android-v${{ steps.ver.outputs.name }}"
          apk="dist/ZimZim-${{ steps.ver.outputs.name }}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --latest=false \
              --title "ZimZim Android ${{ steps.ver.outputs.name }}" \
              --notes "Android app (versionCode ${{ steps.ver.outputs.code }}). Install, paste your walkie link, turn the knob."
          fi
