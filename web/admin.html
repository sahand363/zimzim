<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101211">
<link rel="icon" href="/icon.svg">
<title>ZimZim · Admin</title>
<style>
:root{--bg:#0f1110;--card:#171a16;--line:#252a23;--muted:#8e968a;--orange:#e2552f;--text:#e9ede5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding:env(safe-area-inset-top) 0 40px}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
header h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
header img{width:30px;height:30px;border-radius:8px}
a.btn,button{font:inherit;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#22261f;color:var(--text)}
button.primary{background:var(--orange);color:#fff;font-weight:600}
button.ghost{background:none;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #2c3129;background:#0f110e;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#59654f}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.login{max-width:340px;margin:12vh auto 0}
.err{color:#ff8a70;font-size:13px;min-height:18px;margin-top:8px}
.wk h2{font-size:17px;margin:0}
.wk .sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.link{display:flex;gap:6px;margin:12px 0}
.link input{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#cfd6c8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #2c3129;border-radius:20px;padding:5px 10px;font:13px ui-monospace,Menlo,monospace;cursor:pointer;background:#1c2019}
.chip i{width:8px;height:8px;border-radius:50%;background:#4a5045}
.chip.on i{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.chip .x{color:#6d7568;margin-left:2px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262a24;color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.edit{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<form class="card login hidden" id="login">
  <h1 style="margin:0 0 4px;font-size:20px">ZimZim admin</h1>
  <label>Username</label><input id="lu" autocomplete="username" autocapitalize="off">
  <label>Password</label><input id="lp" type="password" autocomplete="current-password">
  <button class="primary" style="width:100%;margin-top:14px">Sign in</button>
  <div class="err" id="lerr"></div>
</form>

<div class="wrap hidden" id="app">
  <header>
    <h1><img src="/icon.svg" alt="">Walkies</h1>
    <div><button class="ghost" id="logout">Sign out</button><button class="primary" id="newBtn">+ New</button></div>
  </header>

  <form class="card hidden" id="newForm">
    <div class="row"><strong>New walkie</strong><button type="button" class="ghost" id="cancelNew">Cancel</button></div>
    <div class="grid">
      <div><label>Name (who it's for)</label><input id="nName" placeholder="Sara"></div>
      <div><label>Codes, comma separated</label><input id="nCodes" placeholder="home, 7" autocapitalize="off"></div>
      <div><label>Username</label><input id="nUser" autocapitalize="off"></div>
      <div><label>Password</label><div style="display:flex;gap:6px"><input id="nPass"><button type="button" id="gen">↻</button></div></div>
    </div>
    <button class="primary" style="margin-top:14px">Create walkie</button>
    <div class="err" id="nerr"></div>
  </form>

  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
const $=id=>document.getElementById(id);
const base=location.pathname.replace(/[^/]*$/,'');
let data=[];
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function gen(n=10){const a='abcdefghjkmnpqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint8Array(n));return [...r].map(x=>a[x%a.length]).join('');}
async function api(path,method='GET',body){
  const r=await fetch(base+'api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='login'){show(false);throw new Error('login');}
  if(!r.ok) throw new Error(j.error||'Something went wrong');
  return j;
}
function show(authed){$('login').classList.toggle('hidden',authed);$('app').classList.toggle('hidden',!authed);}
async function load(){try{data=await api('walkies');show(true);render();}catch(e){}}
$('login').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';
  try{await api('login','POST',{user:$('lu').value.trim(),pass:$('lp').value});load();}catch(err){$('lerr').textContent=err.message;}};
$('logout').onclick=async()=>{await api('logout','POST');location.reload();};
$('newBtn').onclick=()=>{$('newForm').classList.remove('hidden');$('nPass').value=gen();$('nUser').value=gen(6);$('nName').focus();};
$('cancelNew').onclick=()=>$('newForm').classList.add('hidden');
$('gen').onclick=()=>$('nPass').value=gen();
const parseCodes=s=>s.split(',').map(x=>x.trim()).filter(Boolean).map(c=>({code:c,on:true}));
$('newForm').onsubmit=async e=>{e.preventDefault();$('nerr').textContent='';
  const user=$('nUser').value.trim(),pass=$('nPass').value;
  try{data=await api('walkies','POST',{name:$('nName').value,user,pass,codes:parseCodes($('nCodes').value)});
    $('newForm').reset();$('newForm').classList.add('hidden');render();
    const w=data[data.length-1]; copy(w.link+'\nUser: '+user+'\nPass: '+pass,'Link and login copied');
  }catch(err){$('nerr').textContent=err.message;}};
function copy(t,msg){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast(msg||'Copied'));return;}
  const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'Copied');
}
async function update(id,body,msg){try{data=await api('walkies/'+id,'PUT',body);render();if(msg)toast(msg);}catch(e){toast(e.message);}}
function render(){
  const L=$('list');L.innerHTML='';
  if(!data.length){L.innerHTML='<div class="card empty">No walkies yet. Make one for each person.</div>';return;}
  data.forEach(w=>{
    const c=document.createElement('div');c.className='card wk';
    c.innerHTML=`<div class="row"><div><h2></h2><div class="sub"></div></div><button class="ghost" data-a="edit">Edit</button></div>
      <div class="link"><input readonly><button data-a="copy">Copy</button></div>
      <div class="chips"></div>
      <div class="edit hidden">
        <div class="grid">
          <div><label>Name</label><input data-f="name"></div>
          <div><label>Add code</label><div style="display:flex;gap:6px"><input data-f="code" autocapitalize="off" placeholder="code"><button data-a="addcode">Add</button></div></div>
          <div><label>Username</label><input data-f="user" autocapitalize="off"></div>
          <div><label>New password (blank keeps it)</label><div style="display:flex;gap:6px"><input data-f="pass"><button data-a="gen">↻</button></div></div>
        </div>
        <div class="actions"><button class="primary" data-a="save">Save</button><button data-a="relink">New secret link</button><button data-a="del" style="color:#ff8a70">Delete</button></div>
      </div>`;
    c.querySelector('h2').textContent=w.name;
    c.querySelector('.sub').textContent='user: '+w.user;
    c.querySelector('.link input').value=w.link;
    const chips=c.querySelector('.chips');
    if(!w.codes.length) chips.innerHTML='<span class="sub">No codes</span>';
    w.codes.forEach((k,i)=>{const s=document.createElement('span');s.className='chip'+(k.on?' on':'');s.innerHTML='<i></i><span></span><span class="x">×</span>';
      s.children[1].textContent=k.code;
      s.onclick=ev=>{const codes=w.codes.map(x=>({...x}));if(ev.target.classList.contains('x')){codes.splice(i,1);}else{codes[i].on=!codes[i].on;}update(w.id,{codes});};
      chips.append(s);});
    const ed=c.querySelector('.edit'),f=n=>c.querySelector(`[data-f="${n}"]`);
    f('name').value=w.name;f('user').value=w.user;
    c.onclick=async ev=>{const a=ev.target.dataset.a;if(!a)return;
      if(a==='edit')ed.classList.toggle('hidden');
      if(a==='copy')copy(w.link,'Link copied');
      if(a==='gen')f('pass').value=gen();
      if(a==='addcode'){const v=f('code').value.trim();if(v)update(w.id,{codes:[...w.codes,{code:v,on:true}]});}
      if(a==='save'){const p=f('pass').value;await update(w.id,{name:f('name').value,user:f('user').value,pass:p},'Saved');
        if(p)copy('User: '+f('user').value+'\nPass: '+p,'Saved, new login copied');}
      if(a==='relink'&&confirm('Make a new secret link? The old one stops working.'))update(w.id,{newLink:true},'New link ready');
      if(a==='del'&&confirm('Delete '+w.name+'?')){try{data=await api('walkies/'+w.id,'DELETE');render();}catch(e){toast(e.message);}}
    };
    L.append(c);
  });
}
fetch(base+'api/walkies').then(r=>{if(r.ok)return r.json().then(j=>{data=j;show(true);render();});show(false);$('lu').focus();});
})();
</script>
</body>
</html>
